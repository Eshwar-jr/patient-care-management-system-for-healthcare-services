{% extends "dashboard_base.html" %}

{% block content %}

<div class="container mt-4">

    <div class="card shadow">

        <div class="card-header bg-primary text-white">

            <h3>Edit Appointment</h3>

        </div>

        <div class="card-body">

            <form method="POST">

                {{ form.hidden_tag() }}

               <div class="mb-3">
                    {{ form.reason.label(class="form-label") }}
                    {{ form.reason(class="form-control") }}
                </div>


            <div class="mb-3">

                 <label class="form-label">Status</label>

                 <select class="form-select" name="status">

                    <option value="Booked"
                    {% if appointment.status == "Booked" %}selected{% endif %}>
                       Booked
                    </option>

                    <option value="Completed"
                    {% if appointment.status == "Completed" %}selected{% endif %}>
                       Completed
                    </option>

                    <option value="Cancelled"
                    {% if appointment.status == "Cancelled" %}selected{% endif %}>
                       Cancelled
                    </option>

    </select>

</div>

{{ form.submit(value="Update Appointment",
class="btn btn-warning") }}

<a href="{{ url_for('appointments') }}"
class="btn btn-secondary">

    Cancel

</a>

            </form>

        </div>

    </div>

</div>

{% endblock %}
