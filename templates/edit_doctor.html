{% extends "dashboard_base.html" %}

{% block content %}
<div class="container py-2" style="max-width: 600px;">
    <div class="card border-0 shadow-sm">
        <div class="card-header bg-dark text-white py-3">
            <h4 class="mb-0 fw-bold"><i class="bi bi-pencil-square me-2"></i>Edit Doctor Details</h4>
        </div>
        <div class="card-body p-4">
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label">Full Name</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light text-muted"><i class="bi bi-person"></i></span>
                        <input
                            type="text"
                            name="full_name"
                            class="form-control"
                            value="{{ doctor.full_name }}"
                            required>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Username</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light text-muted"><i class="bi bi-person-badge"></i></span>
                        <input
                            type="text"
                            name="username"
                            class="form-control"
                            value="{{ doctor.username }}"
                            required>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light text-muted"><i class="bi bi-envelope"></i></span>
                        <input
                            type="email"
                            name="email"
                            class="form-control"
                            value="{{ doctor.email }}"
                            required>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label">Phone</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light text-muted"><i class="bi bi-telephone"></i></span>
                        <input
                            type="text"
                            name="phone"
                            class="form-control"
                            value="{{ doctor.phone }}"
                            required>
                    </div>
                </div>

                <div class="d-flex gap-2">
                    <button class="btn btn-warning px-4">
                        Update Doctor
                    </button>
                    <a href="{{ url_for('doctors') }}" class="btn btn-secondary px-4">
                        Cancel
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
